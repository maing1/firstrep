<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            width: 300px;
            height: 300px;
            background-color: aqua;
            padding: 40px;
            margin: 0;
        }
        .innerbox{
            width: 250px;
            height: 250px;
            border: 5px, 2px, 10px, 5px;
            border-color: red, purple, pink, white;
            border-style: solid ;
            background-color: lightcoral;
            border-collapse: collapse;
            padding:50px, 15px, 40px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="innerbox"></div>
    </div>
</body>
</html>
